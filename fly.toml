app = 'consultor'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  # 4 barras = caminho absoluto; app/database.py faz removeprefix("sqlite:///")
  # e sobra /data/carteira.db, dentro do volume.
  DATABASE_URL = 'sqlite:////data/carteira.db'
  PRICE_PROVIDER = 'brapi'
  ANTHROPIC_MODEL = 'claude-sonnet-4-6'
  AGENT_MAX_ITERS = '6'
  QUOTE_CACHE_TTL_SECONDS = '900'
  ENV = 'production'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    path = '/health/live'
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'

[[mounts]]
  source = 'consultor_data'
  destination = '/data'
  initial_size = '1gb'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
