<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultor Financeiro</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a1a2e;
      color: #e8e8e8;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header .badge {
      font-size: 11px;
      font-weight: 400;
      background: #2d2d4e;
      padding: 2px 8px;
      border-radius: 4px;
      color: #9090c0;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .msg {
      max-width: 780px;
      padding: 12px 16px;
      border-radius: 10px;
      line-height: 1.55;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user {
      background: #1a1a2e;
      color: #e8e8e8;
      align-self: flex-end;
    }

    .msg.agent {
      background: #ffffff;
      border: 1px solid #e0e0e0;
      align-self: flex-start;
    }

    .msg.system {
      background: #fffbe6;
      border: 1px solid #ffe58f;
      align-self: center;
      font-size: 13px;
      color: #665700;
      max-width: 600px;
      text-align: center;
    }

    .meta {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
    }

    #form {
      display: flex;
      gap: 8px;
      padding: 14px 20px;
      background: #fff;
      border-top: 1px solid #e0e0e0;
    }

    #input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      resize: none;
      min-height: 42px;
      max-height: 160px;
      line-height: 1.4;
    }

    #input:focus { border-color: #1a1a2e; }

    button {
      padding: 10px 20px;
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      align-self: flex-end;
    }

    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .spinner { display: inline-block; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  Consultor Financeiro Pessoal
  <span class="badge">local · Fase 0</span>
</header>

<div id="chat">
  <div class="msg system">
    Agente em construção. Fase 1 (loop do agente) vem a seguir.<br>
    Por ora: <a href="/health" target="_blank">/health</a> mostra o status das fontes.
  </div>
</div>

<form id="form">
  <textarea id="input" placeholder="Digite sua pergunta..." rows="1"></textarea>
  <button id="btn" type="submit">Enviar</button>
</form>

<script>
  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const btn = document.getElementById('btn');
  const SESSION_ID = 'sess-' + Math.random().toString(36).slice(2, 10);

  // Auto-resize textarea
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  });

  // Ctrl+Enter ou Enter sem shift submete
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.dispatchEvent(new Event('submit')); }
  });

  function addMsg(text, role, meta) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    if (meta) {
      const m = document.createElement('div');
      m.className = 'meta';
      m.textContent = meta;
      div.appendChild(m);
    }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = input.value.trim();
    if (!msg) return;

    input.value = '';
    input.style.height = 'auto';
    btn.disabled = true;

    addMsg(msg, 'user');
    const loading = addMsg('⟳ Consultando...', 'agent');
    loading.querySelector || (loading.innerHTML = '<span class="spinner">⟳</span> Consultando...');

    try {
      const resp = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg, session_id: SESSION_ID }),
      });
      const data = await resp.json();
      loading.textContent = data.reply;
      const meta = (data.tokens_input || data.tokens_output)
        ? `tokens: ${data.tokens_input} in / ${data.tokens_output} out`
        : '';
      if (meta) {
        const m = document.createElement('div');
        m.className = 'meta';
        m.textContent = meta;
        loading.appendChild(m);
      }
    } catch (err) {
      loading.textContent = 'Erro de comunicação com o servidor.';
    } finally {
      btn.disabled = false;
      input.focus();
    }
  });
</script>

</body>
</html>
